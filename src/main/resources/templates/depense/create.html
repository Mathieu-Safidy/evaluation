<body class="skin-blue fixed-layout">
<!-- ============================================================== -->
<!-- Preloader - style you can find in spinners.css -->
<!-- ============================================================== -->
<div class="preloader">
    <div class="loader">
        <div class="loader__figure"></div>
        <p class="loader__label">CRM</p>
    </div>
</div>
<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<div id="main-wrapper">
    <!-- ============================================================== -->
    <!-- Topbar header - style you can find in pages.scss -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/header.html}"></div>
    <!-- ============================================================== -->
    <!-- End Topbar header -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/left-sidebar.html}"></div>
    <!-- ============================================================== -->
    <!-- End Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Page wrapper  -->
    <!-- ============================================================== -->
    <div class="page-wrapper">
        <!-- ============================================================== -->
        <!-- Container fluid  -->
        <!-- ============================================================== -->
        <div class="container-fluid">
            <!-- ============================================================== -->
            <!-- Bread crumb and right sidebar toggle -->
            <!-- ============================================================== -->
            <div th:insert="~{/general/page-titles.html}"></div>
            <!-- ============================================================== -->
            <!-- End Bread crumb and right sidebar toggle -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- Start Page Content -->
            <!-- ============================================================== -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Create New Depense for <p th:text="${customer.name}"></p></h4>
                            <form th:object="${depense}" th:action="@{/employee/depenses/create}"
                                  enctype="multipart/form-data" id="email-form" method="post">
                                <input type="hidden" id="allFiles" name="allFiles">

                                <label class="m-t-20" for="subject">libele:</label>
                                <div class="input-group">
                                    <input type="text" id="subject" th:field="*{libele}" class="form-control">
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('libele')}"
                                          th:errors="*{libele}"></span>
                                </div>




                                <label class="m-t-20" for="startDate">Start Date:</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" th:field="*{createdAt}"
                                           placeholder="2017-06-04" id="startDate">
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('createdAt')}"
                                          th:errors="*{createdAt}"></span>
                                </div>
                                <div class="input-group" th:if="${#fields.hasGlobalErrors()}">
                                  <span class="text-danger font-weight-bold" th:each="error : ${#fields.globalErrors()}"
                                        th:text="${error}">
                                    <span class="text-danger font-weight-bold"
                                          th:if="${error.contains('StartDateBeforeEndDate')}" th:text="${error}">
                                    </span>
                                  </span>
                                </div>


                                <label class="m-t-20" for="amount">Amount:</label>
                                <div class="input-group">
                                    <input type="text" id="amount" th:field="*{montant}" class="form-control">
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('montant')}"
                                          th:errors="*{montant}"></span>
                                </div>


<!--                                <label class="m-t-20" for="customerId2">Budget:</label>-->
<!--                                <div class="input-group">-->
<!--                                    <select th:field="*{budget}" name="budget" id="customerId2" class="form-control">-->
<!--                                        <option th:each="budget : ${customer.budgets}" th:text="${budget.libele}"-->
<!--                                                th:value="${budget.budgetId}"></option>-->
<!--                                    </select>-->
<!--                                </div>-->
                                <label class="m-t-20" for="customerId">Customer:</label>
                                <div class="input-group">
                                    <select th:field="*{customerId}" name="customerId" id="customerId" class="form-control">
                                        <option th:text="${customer.name}"
                                                th:value="${customer.customerId}"></option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary m-t-20">Create Depense</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${hasGoogleDriveAccess}" class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog"
                 aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLongTitle">Create New Google Drive Folder</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body">
                            <form method="post">
                                <input type="hidden" id="id" name="id" class="form-control">
                                <label for="folderName" class="m-t-20">Folder Name</label>
                                <div class="input-group">
                                    <input id="folderName" class="form-control">
                                </div>
                                <div class="input-group m-t-10">
                                    <span id="emailErrors" class="text-danger font-weight-bold"></span>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary" id="create">Create</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============================================================== -->
            <!-- End Page Content -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- Right sidebar -->
            <!-- ============================================================== -->
            <!-- .right-sidebar -->
            <div th:insert="~{/general/right-sidebar.html}"></div>
            <!-- ============================================================== -->
            <!-- End Right sidebar -->
            <!-- ============================================================== -->
        </div>
        <!-- ============================================================== -->
        <!-- End Container fluid  -->
        <!-- ============================================================== -->
    </div>
    <!-- ============================================================== -->
    <!-- End Page wrapper  -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- footer -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/footer.html}"></div>
    <!-- ============================================================== -->
    <!-- End footer -->
    <!-- ============================================================== -->
</div>
<!-- ============================================================== -->
<!-- End Wrapper -->
<!-- ============================================================== -->

<!--Wave Effects -->
<script th:src="@{/js/library/waves.js}" type="text/javascript">></script>
<!--Menu sidebar -->
<script th:src="@{/js/library/sidebarmenu.js}" type="text/javascript">></script>

<script th:src="@{/js/library/sticky-kit.min.js}"></script>
<script th:src="@{/js/library/jquery.sparkline.min.js}" type="text/javascript">></script>
<!--Custom JavaScript -->
<script th:src="@{/js/library/moment.js}"></script>
<script th:src="@{/js/library/jquery-clockpicker.min.js}"></script>
<script th:src="@{/js/library/custom.min.js}" type="text/javascript">></script>

<script th:src="@{/js/library/bootstrap-material-datetimepicker.js}"></script>
<script th:src="@{/js/library/bootstrap-datepicker.min.js}"></script>
<script>
    // MAterial Date picker
    $('#startDate, #endDate').bootstrapMaterialDatePicker({ weekStart: 0, time: false });
    $('#timepicker').bootstrapMaterialDatePicker({ format: 'HH:mm', time: true, date: false });
    $('#date-format').bootstrapMaterialDatePicker({ format: 'dddd DD MMMM YYYY - HH:mm' });

    $('#min-date').bootstrapMaterialDatePicker({ format: 'DD/MM/YYYY HH:mm', minDate: new Date() });
</script>
<script th:src="@{/js/general-dropzone.js}" type="text/javascript"
        th:data-csrf-token="${_csrf.token}" th:data-csrf-header="${_csrf.headerName}"></script>
</body>
